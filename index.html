<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arya Group Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-tr from-slate-900 via-indigo-950 to-slate-900 min-h-screen">

    <!-- Login Section -->
    <div id="login-section" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="glass w-full max-w-md p-8 rounded-3xl shadow-2xl text-white">
            <div class="text-center mb-8">
                <div class="inline-flex p-4 rounded-2xl bg-indigo-600/30 mb-4">
                    <i data-lucide="shield-check" class="w-8 h-8 text-indigo-400"></i>
                </div>
                <h1 class="text-3xl font-bold tracking-tight">Arya Group</h1>
                <p class="text-indigo-200/60 text-sm mt-2">Login to your secure dashboard</p>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-2 ml-1">Full Name</label>
                    <input type="text" id="username" placeholder="Enter name" 
                        class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-2 ml-1">Passcode</label>
                    <input type="password" id="password" placeholder="••••••••" 
                        class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
                <button onclick="attemptLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform active:scale-95">
                    Sign In
                </button>
                <p id="login-error" class="text-red-400 text-center text-xs font-medium hidden">Incorrect passcode. Try '12345'</p>
            </div>
        </div>
    </div>

    <!-- Dashboard Content -->
    <div id="dashboard-content" class="hidden min-h-screen flex flex-col bg-slate-50">
        
        <!-- Top Navbar -->
        <nav class="sticky top-0 z-50 bg-white border-b border-slate-200 px-3 py-2 flex items-center h-16 shadow-sm">
            <!-- Left Section: Profile Info -->
            <div class="flex items-center space-x-2 w-1/3 min-w-0">
                <div class="w-9 h-9 bg-indigo-600 rounded-full flex-shrink-0 flex items-center justify-center text-white font-bold text-xs shadow-md">
                    <span id="user-initial">A</span>
                </div>
                <span id="nav-user-name" class="font-bold text-slate-800 text-[11px] sm:text-xs truncate capitalize leading-tight">User</span>
            </div>
            
            <!-- Center Section: Branding -->
            <div class="flex-grow flex justify-center px-1">
                <span class="text-xs sm:text-sm font-black tracking-tighter text-indigo-700 uppercase whitespace-nowrap">ARYA GROUP</span>
            </div>

            <!-- Right Section: Status & Logout -->
            <div class="flex items-center justify-end space-x-2 w-1/3">
                <div class="hidden sm:flex flex-col items-end mr-1">
                    <span class="text-[8px] font-bold text-green-500 uppercase leading-none">Live Status</span>
                    <svg width="36" height="18" viewBox="0 0 40 20" class="text-green-500">
                        <path d="M0 15 Q 10 5, 20 15 T 40 10" fill="none" stroke="currentColor" stroke-width="2" class="graph-line" />
                    </svg>
                </div>
                <button onclick="location.reload()" class="p-2 text-slate-400 hover:text-red-500 transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </nav>

        <!-- Main View Area -->
        <main class="flex-grow p-4 pb-28">
            <div class="max-w-4xl mx-auto space-y-6">
                <!-- Home Cards -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-indigo-600 p-6 rounded-3xl text-white shadow-lg shadow-indigo-200 relative overflow-hidden">
                        <i data-lucide="zap" class="absolute -right-2 -bottom-2 w-20 h-20 opacity-20"></i>
                        <h3 class="text-sm font-medium opacity-80">Total Activity</h3>
                        <p class="text-3xl font-bold mt-1">84%</p>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <h3 class="text-sm font-medium text-slate-500">System Status</h3>
                        <p class="text-3xl font-bold text-slate-800 mt-1">Online</p>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 mb-4">Recent Notifications</h3>
                    <div class="space-y-4">
                        <div class="flex items-center space-x-3 p-3 bg-slate-50 rounded-2xl">
                            <div class="w-10 h-10 bg-green-100 text-green-600 rounded-full flex items-center justify-center">
                                <i data-lucide="check" class="w-5 h-5"></i>
                            </div>
                            <div class="text-sm">
                                <p class="font-semibold">Security Update</p>
                                <p class="text-slate-500 text-xs">Everything is looking good.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <div class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-slate-200 px-6 py-3 z-50">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <button class="nav-item flex flex-col items-center space-y-1 text-indigo-600">
                    <i data-lucide="home" class="w-6 h-6"></i>
                    <span class="text-[10px] font-bold">Home</span>
                </button>
                <button class="nav-item flex flex-col items-center space-y-1 text-slate-400 hover:text-indigo-600 transition">
                    <i data-lucide="smartphone" class="w-6 h-6"></i>
                    <span class="text-[10px] font-bold">Devices</span>
                </button>
                <button class="nav-item flex flex-col items-center space-y-1 text-slate-400 hover:text-indigo-600 transition">
                    <i data-lucide="message-circle" class="w-6 h-6"></i>
                    <span class="text-[10px] font-bold">SMS</span>
                </button>
                <button class="nav-item flex flex-col items-center space-y-1 text-slate-400 hover:text-indigo-600 transition">
                    <i data-lucide="grid" class="w-6 h-6"></i>
                    <span class="text-[10px] font-bold">More</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
